<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETSOL Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Brand color extracted directly from the uploaded NETSOL logo mark (#1b75bb) */
    --brand: #1b75bb;
    --brand-light: #4a9bda;
    --brand-deep: #124d78;
    --brand-glow: rgba(27, 117, 187, 0.5);
    --brand-soft: rgba(27, 117, 187, 0.14);
    --brand-soft-strong: rgba(27, 117, 187, 0.24);

    --bg: #05070c;
    --bg-alt: #080b12;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-strong: rgba(255, 255, 255, 0.055);
    --surface-hover: rgba(255, 255, 255, 0.075);
    --surface-solid: #0d1119;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);

    --text: #f2f4f8;
    --text-dim: #98a2b3;
    --text-faint: #5d6779;

    --danger: #f16a65;
    --danger-soft: rgba(241, 106, 101, 0.12);
    --violet: #9c8cf5;
    --violet-soft: rgba(156, 140, 245, 0.14);
    --amber: #f2b25c;
    --amber-soft: rgba(242, 178, 92, 0.14);

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-pill: 999px;

    --font-display: "Space Grotesk", "Inter", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--brand-soft-strong); color: var(--text); }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ---------- Ambient background glow ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .ambient::before,
  .ambient::after {
    content: "";
    position: absolute;
    width: 62vw;
    height: 62vw;
    max-width: 900px;
    max-height: 900px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.28;
    animation: drift 22s ease-in-out infinite alternate;
  }

  .ambient::before {
    background: radial-gradient(circle, var(--brand) 0%, transparent 70%);
    top: -18%;
    left: -14%;
  }

  .ambient::after {
    background: radial-gradient(circle, var(--brand-light) 0%, var(--brand) 45%, transparent 72%);
    bottom: -32%;
    right: -28%;
    opacity: 0.38;
    animation-delay: -11s;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(4%, 5%) scale(1.08); }
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.5;
  }

  h1, h2, h3, .display {
    font-family: var(--font-display);
  }

  a { color: var(--brand-light); }

  /* ---------- Header ---------- */
  header.topbar {
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    background: rgba(6, 9, 14, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }

  .topbar-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 13px 22px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    grid-column: 2;
  }

  .topbar-right {
    grid-column: 3;
    justify-self: end;
  }

  .brand-mark img {
    display: block;
    width: 30px;
    height: 30px;
    object-fit: contain;
  }

  @keyframes logoBounce {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-6px) scale(1.05); }
    65%  { transform: translateY(0.5px) scale(0.99); }
    100% { transform: translateY(0) scale(1); }
  }

  .logo-bounce {
    animation: logoBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .brand-mark .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
    color: var(--text);
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .brand-mark .name .assistant {
    font-weight: 500;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand-light);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 6px 12px 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3fd67a;
    box-shadow: 0 0 0 0 rgba(63, 214, 122, 0.5);
    animation: pulse-dot 2.2s infinite;
  }

  @keyframes pulse-dot {
    0% { box-shadow: 0 0 0 0 rgba(63, 214, 122, 0.45); }
    70% { box-shadow: 0 0 0 7px rgba(63, 214, 122, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 214, 122, 0); }
  }

  #clearBtn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.15s ease;
  }

  #clearBtn:hover {
    border-color: var(--border-strong);
    color: var(--text);
    background: var(--surface-hover);
    transform: translateY(-1px);
  }

  /* ---------- Chat area ---------- */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #chatScroll {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  #chatScroll::-webkit-scrollbar { width: 8px; }
  #chatScroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
  #chatScroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

  #chatInner {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 22px 12px 22px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Empty state ---------- */
  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 460px;
    padding: 40px 0;
  }

  .empty-state .glyph {
    width: 92px;
    height: 92px;
    margin: 0 auto 22px auto;
  }

  .empty-state .glyph img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    will-change: transform;
  }

  .empty-state h1 {
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px 0;
    background: linear-gradient(135deg, #ffffff 30%, var(--brand-light) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .empty-state p {
    color: var(--text-dim);
    font-size: 0.92rem;
    line-height: 1.6;
    margin: 0 0 26px 0;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
  }

  .suggestion-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 9px 15px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
  }

  .suggestion-chip:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -14px var(--brand-glow);
  }

  .suggestion-chip svg { flex-shrink: 0; opacity: 0.85; }

  /* ---------- Messages ---------- */
  #chat {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 8px;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    animation: rise 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }

  .msg {
    padding: 13px 17px;
    border-radius: var(--radius-md);
    line-height: 1.62;
    font-size: 0.93rem;
  }

  .msg p { margin: 0 0 8px 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 4px 0 8px 0; padding-left: 20px; }
  .msg li { margin-bottom: 3px; }

  .msg-row.user .msg {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 8px 24px -14px var(--brand-glow);
  }

  .msg-row.bot .msg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    backdrop-filter: blur(8px);
  }

  .msg-row.bot .msg.error {
    border-color: rgba(241, 106, 101, 0.35);
    background: var(--danger-soft);
    color: #ffd3d1;
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 3px 2px;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand-light);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Document / CSV indicator ---------- */
  #docIndicator {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--violet-soft);
    border: 1px solid rgba(156, 140, 245, 0.28);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 0.8rem;
    color: var(--text);
    margin: 0 0 10px 0;
    backdrop-filter: blur(8px);
  }

  #docIndicator.csv-mode {
    background: rgba(63, 214, 122, 0.1);
    border-color: rgba(63, 214, 122, 0.28);
  }

  #docIndicator.visible { display: flex; }

  #docIndicator .doc-icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--violet); }
  #docIndicator.csv-mode .doc-icon { color: #6fe39a; }

  #docIndicator .doc-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  #docIndicator button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1;
    padding: 2px 4px;
    transition: color 0.15s ease;
  }

  #docIndicator button:hover { color: var(--danger); }

  /* ---------- Input dock ---------- */
  .input-dock {
    position: relative;
    z-index: 5;
    flex-shrink: 0;
    padding: 12px 22px calc(16px + env(safe-area-inset-bottom, 0)) 22px;
    background:
      radial-gradient(rgba(255,255,255,0.0125) 1px, transparent 1px) 0 0 / 3px 3px,
      linear-gradient(180deg, transparent 0%, var(--bg) 30%);
  }

  .input-dock-inner {
    max-width: 780px;
    margin: 0 auto;
  }

  form#chatForm {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-strong);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 7px 7px 7px 8px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  form#chatForm:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-soft), 0 16px 40px -20px var(--brand-glow);
  }

  #uploadBtn {
    background: transparent;
    border: none;
    border-radius: var(--radius-pill);
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    transition: color 0.18s ease, background 0.18s ease;
  }

  #uploadBtn:hover { color: var(--brand-light); background: var(--surface-hover); }
  #uploadBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #question {
    flex: 1;
    padding: 9px 4px;
    border: none;
    background: transparent;
    font-size: 0.94rem;
    font-family: var(--font-body);
    color: var(--text);
    outline: none;
  }

  #question::placeholder { color: var(--text-faint); }

  button[type="submit"] {
    background: linear-gradient(135deg, var(--brand-light), var(--brand));
    color: #fff;
    border: none;
    border-radius: var(--radius-pill);
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 6px 18px -8px var(--brand-glow);
  }

  button[type="submit"]:hover { transform: scale(1.06); box-shadow: 0 8px 22px -8px var(--brand-glow); }
  button[type="submit"]:active { transform: scale(0.96); }

  button[type="submit"]:disabled {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.6;
  }

  footer.disclaimer {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.68rem;
    padding: 2px 22px 4px 22px;
    max-width: 780px;
    margin: 0 auto;
  }

  @media (max-width: 640px) {
    .topbar-inner { padding: 11px 16px; }
    .status-pill .label { display: none; }
    #chatInner { padding: 20px 14px 8px 14px; }
    .input-dock { padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0)) 14px; }
    .msg-row { max-width: 92%; }
    .empty-state h1 { font-size: 1.4rem; }
  }
  /* ---------- Cursor-follow ambient glow ---------- */
  /* Very soft, low-opacity light that tracks the pointer — meant to be felt
     more than seen. Disabled on touch devices (no persistent cursor to
     follow) via the hover/pointer media query below, so mobile just skips
     the whole thing. */
  /* Registering these as animatable percentages lets the browser smoothly
     interpolate the glow's position between updates instead of snapping
     frame-to-frame — gives it a soft, silky trailing feel rather than
     tracking the cursor exactly. Falls back gracefully (instant jump) in
     browsers that don't support @property. */
  @property --mx {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 50%;
  }
  @property --my {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 35%;
  }

  @media (hover: hover) and (pointer: fine) {
    #cursorGlow {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        320px circle at var(--mx, 50%) var(--my, 35%),
        rgba(90, 165, 225, 0.04),
        transparent 75%
      );
      filter: blur(50px);
      transition: opacity 0.7s ease, --mx 0.35s ease-out, --my 0.35s ease-out;
    }

    #cursorGlow.active { opacity: 1; }
  }
</style>
</head>

<div class="grain" aria-hidden="true"></div>
<div id="cursorGlow" aria-hidden="true"></div>

  const chat = document.getElementById("chat");
  let emptyState = document.getElementById("emptyState");
  const chatScroll = document.getElementById("chatScroll");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");
  const uploadBtn = document.getElementById("uploadBtn");
  const fileInput = document.getElementById("fileInput");
  const docIndicator = document.getElementById("docIndicator");
  const docName = document.getElementById("docName");
  const removeDocBtn = document.getElementById("removeDocBtn");
  const chipUpload = document.getElementById("chipUpload");

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  async function uploadDocument(file) {
    uploadBtn.disabled = true;
    const formData = new FormData();
    formData.append("session_id", sessionId);
    formData.append("file", file);

    try {
      const res = await fetch(UPLOAD_URL, { method: "POST", body: formData });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || `Upload failed (${res.status})`);
      }

      docIndicator.classList.toggle("csv-mode", data.kind === "csv");
      if (data.kind === "csv") {
        docName.textContent = `${data.filename} — ${data.rows.toLocaleString()} rows × ${data.columns} columns`;
      } else {
        docName.textContent = `${data.filename} (${data.chars.toLocaleString()} chars)`;
      }
      docIndicator.classList.add("visible");
    } catch (err) {
      alert(err.message || "Couldn't upload that file.");
      console.error(err);
    } finally {
      uploadBtn.disabled = false;
      fileInput.value = "";
    }
  }

  uploadBtn.addEventListener("click", () => fileInput.click());
  chipUpload.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      uploadDocument(fileInput.files[0]);
    }
  });

  removeDocBtn.addEventListener("click", async () => {
    try {
      const formData = new FormData();
      formData.append("session_id", sessionId);
      await fetch(CLEAR_DOC_URL, { method: "POST", body: formData });
    } catch (err) {
      console.error(err);
    }
    docIndicator.classList.remove("visible", "csv-mode");
    docName.textContent = "";
  });

  // Very small formatter: turns "* item" / "- item" lines into a real <ul>,
  // and blank-line-separated text into paragraphs. Just enough to make
  // Gemini's bullet-style answers look right without a full markdown library.
  function formatAnswer(text) {
    const lines = text.split("\n");
    let html = "";
    let inList = false;

    for (const rawLine of lines) {
      const line = rawLine.trim();
      const isBullet = line.startsWith("* ") || line.startsWith("- ");

      if (isBullet) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${escapeHtml(line.slice(2))}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (line) html += `<p>${escapeHtml(line)}</p>`;
      }
    }
    if (inList) html += "</ul>";
    return html || `<p>${escapeHtml(text)}</p>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addUserMessage(text) {
    if (emptyState) { emptyState.remove(); emptyState = null; }

    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addBotMessage({ text, error, thinking }) {
    if (emptyState) { emptyState.remove(); emptyState = null; }

    const row = document.createElement("div");
    row.className = "msg-row bot";

    const bubble = document.createElement("div");
    bubble.className = "msg" + (error ? " error" : "");

    if (thinking) {
      bubble.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;
    } else if (error) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = formatAnswer(text);
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  async function sendQuestion(question) {
    addUserMessage(question);
    const thinkingRow = addBotMessage({ thinking: true });

    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sessionId }),
      });

      if (!res.ok) throw new Error(`Server responded with ${res.status}`);

      const data = await res.json();
      thinkingRow.remove();
      addBotMessage({ text: data.answer });
    } catch (err) {
      thinkingRow.remove();
      addBotMessage({
        text: "Couldn't reach the chatbot API. Make sure the FastAPI server is running at " + API_URL,
        route: "ERROR",
        error: true,
      });
      console.error(err);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    sendQuestion(q);
  });

  document.querySelectorAll(".example-btn").forEach((btn) => {
    btn.addEventListener("click", () => sendQuestion(btn.dataset.q));
  });

  clearBtn.addEventListener("click", () => {
    chat.innerHTML = "";
    location.reload();
  });

  // ---------- Cursor-follow ambient glow + logo proximity bounce ----------
  (function () {
    const glow = document.getElementById("cursorGlow");
    const heroLogo = document.getElementById("heroLogo");
    const hasFineCursor = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (!hasFineCursor) return;

    let pendingFrame = null;
    let px = 50, py = 35;   // glow position, as percentages
    let cx = 0, cy = 0;     // raw cursor position, in pixels
    let logoNear = false;
    const LOGO_PROXIMITY_RADIUS = 130; // px — how close the cursor needs to get

    if (heroLogo) {
      heroLogo.addEventListener("animationend", () => {
        heroLogo.classList.remove("logo-bounce");
      });
    }

    function checkLogoProximity() {
      if (!heroLogo || !heroLogo.isConnected) return;
      const rect = heroLogo.getBoundingClientRect();
      const dx = cx - (rect.left + rect.width / 2);
      const dy = cy - (rect.top + rect.height / 2);
      const isNear = Math.hypot(dx, dy) < LOGO_PROXIMITY_RADIUS;

      if (isNear && !logoNear) {
        logoNear = true;
        heroLogo.classList.remove("logo-bounce");
        void heroLogo.offsetWidth; // restart the animation if it's mid-flight
        heroLogo.classList.add("logo-bounce");
      } else if (!isNear && logoNear) {
        logoNear = false;
      }
    }

    function apply() {
      if (glow) {
        glow.style.setProperty("--mx", px + "%");
        glow.style.setProperty("--my", py + "%");
      }
      checkLogoProximity();
      pendingFrame = null;
    }

    window.addEventListener("mousemove", (e) => {
      cx = e.clientX;
      cy = e.clientY;
      px = (cx / window.innerWidth) * 100;
      py = (cy / window.innerHeight) * 100;
      if (glow) glow.classList.add("active");
      if (pendingFrame === null) pendingFrame = requestAnimationFrame(apply);
    }, { passive: true });

    window.addEventListener("mouseleave", () => {
      if (glow) glow.classList.remove("active");
    });
  })();
</script>

</body>
</html>
